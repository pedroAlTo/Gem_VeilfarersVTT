[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_DATABASE_URL,VITE_CLOUDINARY_CLOUD_NAME,VITE_CLOUDINARY_PRESET,VITE_CLOUDINARY_UPLOAD_PRESET"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,src/vtt-integration/modules/firebaseClient.js,dist/**"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

